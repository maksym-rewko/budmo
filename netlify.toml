[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/home-1"
  to = "/"
  status = 301

[[redirects]]
  from = "/404-error"
  to = "/404"
  status = 301

[[redirects]]
  from = "/book"
  to = "/#book"
  status = 301
